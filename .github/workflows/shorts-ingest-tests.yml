name: Shorts ingestion validation
on:
  push:
    branches: [feature/shorts-ingest-validation]
  pull_request:
    paths:
      - 'shorts_ingest.py'
      - 'tests/test_shorts_ingest.py'
      - '.github/workflows/shorts-ingest-tests.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_shorts_ingest.py' -v
